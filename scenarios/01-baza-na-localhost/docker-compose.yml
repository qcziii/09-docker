# Sklep + PostgreSQL. Uruchomienie: docker compose up --build -d
name: kurs-docker-01
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sklep
      POSTGRES_USER: sklep
      POSTGRES_PASSWORD: sklep
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U sklep -d sklep"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
