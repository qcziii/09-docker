name: kurs-docker-15
services:
  app:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Limit from the cluster administrator: 512 MB per instance, no swap
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      # JVM settings copied from the production server
      JAVA_OPTS: "-Xms1g -Xmx1g -XX:+AlwaysPreTouch"
