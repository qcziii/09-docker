# Sklep + PostgreSQL. Dane bazy trzymamy w wolumenie "dane", żeby przetrwały restart.
name: kurs-docker-11
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sklep
      POSTGRES_USER: sklep
      POSTGRES_PASSWORD: sklep
    volumes:
      - dane:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U sklep -d sklep"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sklep
    depends_on:
      db:
        condition: service_healthy

volumes:
  dane:
