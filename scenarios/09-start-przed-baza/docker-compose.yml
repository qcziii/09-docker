# Sklep + PostgreSQL. Skrypty z katalogu db/ wykonują się przy pierwszym starcie bazy.
name: kurs-docker-09
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sklep
      POSTGRES_USER: sklep
      POSTGRES_PASSWORD: sklep
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sklep
    depends_on:
      - db
